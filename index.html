<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Stan Hunt VR</title>
   <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
   <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
   <script src="script.js"></script>
</head>
<!--vr code below-->
<body>
<a-scene>

<script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
<a-entity environment="preset: japan; dressingAmount: 5;"></a-entity>
 


<a-cylinder id="floor" position="0 0 0" radius="7.5" src="Assests/Car.jpg"  height="0.1"></a-cylinder>
<a-box id="box1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="brown"></a-box>
<a-box id="box2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="brown"></a-box>
<a-box id="box3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="brown"></a-box>
<a-box id="box4"position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="brown"></a-box>
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"></a-cylinder>
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="black"></a-box>
<a-box id="roof_right" position="-2.580 4.328 0" rotation="28.433 -90 0" scale="10.931 0.20 6.110" color="black"></a-box>

<!-- Video -->
<video id="videoclip" loop="true"src="tvAssets/harry_potter.mp4" crossorigin="anonymous" preload="auto"></video>
<!-- Buttons and Background -->
  <img id="play" src="tvAssets/btnPlay.png" preload="auto">
  <img id="pause" src="tvAssets/btnPause.png" preload="auto">
  <img id="tv_background" src="tvAssets/tv_background.jpg"preload="auto">

<!-- TV with Play and Pause -->
<a-entity>
  <a-video src="#videoclip" position="-3.893 1.6 0" rotation="0 90 0" width="2" height="1.125"></a-video>

  <!-- TV background -->
  <a-plane id="videoControls" position="-3.893 0.854 0" scale="2 0.386 1.714" rotation="0 90 0" opacity="1" src="#tv_background">
    
    <!-- Play button -->
    <a-plane id="vidplaybox" src="#play" scale="0.122 0.678 0.122" position="-0.350 0 .01" shader="flat" transparent="true" videoplayer></a-plane>
    
    <!-- Stop button -->
    <a-plane id="vidpausebox" src="#pause" scale="0.122 0.678 0.122" position="0.350 0 .01" shader="flat" transparent="true" videopauser></a-plane>

  </a-plane>
</a-entity>

<!-- Allows clicking with the mouse -->
<a-entity cursor="rayOrigin: mouse"></a-entity>









</a-scene>
</body>
</html>
